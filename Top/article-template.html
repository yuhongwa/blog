<!doctype html>
<html lang="zh-CN">

</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <header class="site-header shell">
    <div class="masthead">
      <a class="brand" href="../index.html">TOP <span>2025</span></a>
      <a class="main-link" href="/">Main 主站 ↗</a>
      <button class="language-toggle" id="language-toggle" type="button">English</button>
    </div>
    <nav class="section-nav" aria-label="TOP 栏目导航">
      <a href="../index.html">Home</a>
      <a class="{{HUB_CLASS}}" href="../category.html?id=01">Hub</a>
      <a class="{{PEOPLE_CLASS}}" href="../category.html?id=02">People</a>
      <a class="{{PROJECT_CLASS}}" href="../category.html?id=03">Project</a>

      <a class="{{NEWS_CLASS}}" href="../category.html?id=05">News</a>
      <a class="{{CULTURE_CLASS}}" href="../category.html?id=06">Culture</a>
      <form class="nav-search" action="../search.html" role="search">
        <label class="sr-only" for="nav-search-article">搜索 TOP</label>
        <input id="nav-search-article" name="q" type="search" placeholder="Search 搜索" data-placeholder-zh="Search 搜索" data-placeholder-en="Search" data-aria-zh="搜索 TOP" data-aria-en="Search TOP" aria-label="搜索 TOP">
        <button type="submit" aria-label="提交搜索">⌕</button>
      </form>
      <a href="../about.html">About</a>
    </nav>
  </header>

  <main id="main" class="shell article-main">
    <header class="article-head">
      <p class="label"><span class="article-zh">{{CATEGORY_NAME}}</span><span class="article-en">{{CATEGORY_NAME_EN}}</span></p>
      <h1><span class="article-zh">{{ARTICLE_TITLE}}</span><span class="article-en">{{ARTICLE_TITLE_EN}}</span></h1>
      <p><span class="article-zh">{{DESCRIPTION}}</span><span class="article-en">{{DESCRIPTION_EN}}</span></p>
    </header>

    <article class="article-body article-body-zh">
{{ARTICLE_BODY}}
    </article>
    <article class="article-body article-body-en" hidden>
{{ARTICLE_BODY_EN}}
    </article>

    <nav class="article-end" aria-label="文章导航">
      <a href="../category.html?id={{CATEGORY_ID}}">← <span data-zh="返回 {{CATEGORY_NAME}}" data-en="Back to {{CATEGORY_NAME_EN}}">返回 {{CATEGORY_NAME}}</span></a>
      <a href="../index.html">TOP <span data-zh="首页" data-en="Home">首页</span> →</a>

  <footer class="footer shell">
    <span>TOP 2025</span>
    <a href="../about.html">介绍与更新 →</a>
    <span class="site-stats" aria-label="网站访问统计"><span data-zh="本站访问" data-en="Site views">本站访问</span> <span id="busuanzi_value_site_pv">—</span> · <span data-zh="本页访问" data-en="Page views">本页访问</span> <span id="busuanzi_value_page_pv">—</span></span>
