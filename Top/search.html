<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="搜索 TOP 年度收录。">
  <title>搜索｜TOP 2025</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="./assets/i18n.js" defer></script>
  <script src="./assets/search-index.js" defer></script>
  <script src="./assets/search.js" defer></script>
</head>
<body data-page="search">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header shell">
    <div class="masthead">
      <a class="brand" href="./index.html">TOP <span>2025</span></a>
      <a class="main-link" href="/">Main 主站 ↗</a>
      <button class="language-toggle" id="language-toggle" type="button">English</button>
    </div>
    <nav class="section-nav" aria-label="TOP 栏目导航">
      <a href="./index.html">Home</a>
      <a href="./category.html?id=01">Hub</a>
      <a href="./category.html?id=02">People</a>
      <a href="./category.html?id=03">Project</a>
      <a href="./category.html?id=04">Post</a>
      <a href="./category.html?id=05">News</a>
      <a href="./category.html?id=06">Culture</a>
      <form class="nav-search" action="./search.html" role="search">
        <label class="sr-only" for="nav-search-page">搜索 TOP</label>
        <input id="nav-search-page" name="q" type="search" placeholder="Search 搜索" data-placeholder-zh="Search 搜索" data-placeholder-en="Search" data-aria-zh="搜索 TOP" data-aria-en="Search TOP" aria-label="搜索 TOP">
        <button type="submit" aria-label="提交搜索">⌕</button>
      </form>
      <a href="./about.html">About</a>
    </nav>
  </header>

  <main id="main" class="shell search-main">
    <header class="category-head">
      <p class="label">SEARCH / TOP 2025</p>
      <h1 data-zh="Search 搜索" data-en="Search">Search 搜索</h1>
      <p data-zh="输入关键词，搜索文章标题、栏目说明和正文，并定位到对应小节。" data-en="Search titles, section notes and article text, then jump to the matching section.">输入关键词，搜索文章标题、栏目说明和正文，并定位到对应小节。</p>
    </header>
    <form class="search-form" id="search-form" role="search">
      <label class="sr-only" for="search-input">搜索 TOP</label>
      <input id="search-input" name="q" type="search" placeholder="搜索人物、项目、论文、帖子……" data-placeholder-zh="搜索人物、项目、论文、帖子……" data-placeholder-en="Search people, projects, papers and posts" autocomplete="off">
      <button type="submit" data-zh="搜索" data-en="Search">搜索</button>
    </form>
    <div class="search-options" aria-label="检索选项">
      <label><span data-zh="栏目" data-en="Section">栏目</span>
        <select id="search-category">
          <option value="" data-zh="全部" data-en="All">全部</option>
          <option value="Hub" data-zh="Hub / 资源" data-en="Hub / Resources">Hub / 资源</option>
          <option value="People" data-zh="People / 人物故事" data-en="People / Stories">People / 人物故事</option>
          <option value="Project" data-zh="Project / 事情与项目" data-en="Project / Projects">Project / 事情与项目</option>
          <option value="Post" data-zh="Post / 年度帖子" data-en="Post / Posts">Post / 年度帖子</option>
          <option value="News" data-zh="News / 年度事件与新闻" data-en="News / Events and news">News / 年度事件与新闻</option>
          <option value="Culture" data-zh="Culture / 年度文化" data-en="Culture / Culture">Culture / 年度文化</option>
        </select>
      </label>
      <label><span data-zh="范围" data-en="Scope">范围</span>
        <select id="search-scope">
          <option value="all" data-zh="标题与正文" data-en="Title and body">标题与正文</option>
          <option value="title" data-zh="只看标题" data-en="Title only">只看标题</option>
          <option value="body" data-zh="只看正文" data-en="Body only">只看正文</option>
        </select>
      </label>
    </div>
    <p class="search-status" id="search-status">输入关键词开始检索。</p>
    <section class="entry-list search-results" id="search-results" aria-live="polite"></section>
  </main>

  <footer class="footer shell">
    <a href="./index.html">← TOP 首页</a>
    <a href="./about.html">介绍与更新 →</a>
    <span class="site-stats" aria-label="网站访问统计"><span data-zh="本站访问" data-en="Site views">本站访问</span> <span id="busuanzi_value_site_pv">—</span> · <span data-zh="本页访问" data-en="Page views">本页访问</span> <span id="busuanzi_value_page_pv">—</span></span>
  </footer>
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
